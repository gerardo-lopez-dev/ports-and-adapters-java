# Local development with docker-compose
# Safe defaults for localhost — no secrets here.

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:h2:mem:localdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
  flyway:
    enabled: false

app:
  flyway:
    schemas: _shared,auth

logging:
  level:
    root: INFO
    com.example: DEBUG
