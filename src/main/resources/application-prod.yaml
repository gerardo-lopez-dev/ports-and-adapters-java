# Production — zero defaults.
# Missing env vars → app fails to start (fail loudly).
#
# NOTE: adjust the keys below to the actual properties your project uses
# (datasource, messaging, etc). Key point: no variable here has a fallback
# ("${VAR}", never "${VAR:default}").

server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  level:
    root: WARN
    com.example: INFO
