spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:h2:mem:flywaytest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

app:
  flyway:
    schemas: _shared,auth

logging:
  level:
    root: WARN
    com.example: WARN
