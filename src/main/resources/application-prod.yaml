# Production — zero defaults.
# Missing env vars → app fails to start (fail loudly).

server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false

app:
  flyway:
    schemas: _shared,auth

logging:
  level:
    root: WARN
    com.example: INFO
